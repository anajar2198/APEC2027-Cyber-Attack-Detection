<text x="28" y="44" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#172b3a" text-anchor="start">Two measurement devices, one motor-drive experiment</text>
<text x="28" y="75" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#485b68" text-anchor="start">Measurement location determines what each dataset represents</text>
